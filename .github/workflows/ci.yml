# =============================================================================
# The contrast budget, on every push.
#
# Contrast verification: scripts/contrast.mjs runs
# the budget on 8 themes x 2 grounds and exits non-zero if any of the 814
# assertions drifts. A colour change that lowers a ceiling cannot merge.
#
# The contrast verifier has no dependencies. Browser workflow tests use Playwright.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    name: contrast budget · 16 palettes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node scripts/contrast.mjs
        run: node scripts/contrast.mjs

      # Prints every pair on all sixteen palettes into the job log, so a
      # regression is diagnosable from the failed run alone rather than only
      # reproducible locally.
      - name: full budget (verbose log)
        if: always()
        run: node scripts/contrast.mjs --verbose

      # tokens.json is generated from the CSS. The step above already fails if
      # the committed file disagrees; this makes the remedy explicit in the log.
      - name: tokens.json is in sync
        run: |
          node scripts/contrast.mjs --emit-json
          git diff --exit-code -- src/tokens.json \
            || (echo "::error::src/tokens.json is stale — run: node scripts/contrast.mjs --emit-json" && exit 1)

  browser:
    name: demo interactions and keyboard access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser verification tooling
        run: |
          npm install --ignore-scripts --no-package-lock
          npx playwright install --with-deps chromium

      - name: Verify interactive demo and keyboard flows
        run: npm run test:browser
        env:
          GLASS_EVIDENCE_DIR: ${{ runner.temp }}/glass-browser-evidence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-browser-evidence
          path: ${{ runner.temp }}/glass-browser-evidence
